# Pre-commit hooks for Nexus RTP Platform
# Install: pip install pre-commit && pre-commit install

repos:
  # Standard pre-commit hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        exclude: ^docs/performance/runs/
      - id: end-of-file-fixer
        exclude: ^docs/performance/runs/
      - id: check-yaml
        args: ['--allow-multiple-documents']
      - id: check-json
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
      - id: detect-private-key
      - id: detect-aws-credentials
        args: ['--allow-missing-credentials']

  # Gitleaks - Secret scanning
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.1
    hooks:
      - id: gitleaks

  # Native Go commands work with Windows paths and this multi-module workspace.
  - repo: local
    hooks:
      - id: go-fmt
        name: Go formatting
        entry: gofmt -w
        language: system
        types: [go]
      - id: go-vet
        name: Go vet changed modules
        entry: python scripts/vet_changed_go.py
        language: system
        types: [go]
      - id: go-imports
        name: Go imports
        entry: go run golang.org/x/tools/cmd/goimports@v0.28.0 -w
        language: system
        types: [go]

  # Custom PAN scanner
  - repo: local
    hooks:
      - id: pan-scan
        name: PAN/Secret Scanner
        entry: bash security/pan-scan.sh
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: no-hardcoded-secrets
        name: Check for hardcoded secrets
        entry: python scripts/check_staged_config.py secrets
        language: system
        pass_filenames: false

      - id: no-localhost-in-prod-configs
        name: Check for localhost in production configs
        entry: python scripts/check_staged_config.py production-hosts
        language: system
        pass_filenames: false
