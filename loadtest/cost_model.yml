# ==============================================================================
# COST OPTIMIZATION OPPORTUNITIES
# ==============================================================================

optimization:
  reserved_instances:
    current_coverage: 70
    target_coverage: 90
    potential_savings_monthly: 2500
    
  spot_instances:
    eligible_workloads:
      - batch_reconciliation
      - load_testing
      - dev_environments
    potential_savings_monthly: 1000
    
  storage_tiering:
    glacier_migration:
      eligible_gb: 200000
      savings_per_gb: 0.02
      potential_savings_monthly: 4000
      
  right_sizing:
    overprovisioned_instances: 8
    potential_savings_monthly: 800
    
  total_optimization_potential: 8300
  optimized_infrastructure_monthly: 38972

# ==============================================================================
# SCALING PROJECTIONS
# ==============================================================================

scaling:
  # Cost scales sub-linearly due to economies of scale
  projections:
    - tps: 1000
      monthly_cost: 47272
      cost_per_tx: 0.0000189
      
    - tps: 5000
      monthly_cost: 82000              # 1.7x cost for 5x volume
      cost_per_tx: 0.0000127
      
    - tps: 10000
      monthly_cost: 120000             # 2.5x cost for 10x volume
      cost_per_tx: 0.0000093
      
    - tps: 50000
      monthly_cost: 350000             # 7.4x cost for 50x volume
      cost_per_tx: 0.0000054
      
  notes:
    - "Database costs scale with IOPS, not linearly with TPS"
    - "Kafka costs scale with retention, not throughput"
    - "Reserved instance discounts improve at higher scale"
    - "Engineering costs relatively fixed up to 50,000 TPS"
