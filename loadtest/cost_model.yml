# Nexus RTP Total Cost of Ownership (TCO) Model
# All costs in USD per month unless specified

# ==============================================================================
# INFRASTRUCTURE SIZING
# ==============================================================================

sizing:
  tps_targets:
    baseline: 1000      # Normal operations
    peak: 10000        # Peak load (10x)
    burst: 50000       # Short burst capacity
    
  transaction_volume:
    daily: 86_400_000   # 1000 TPS × 86400 seconds
    monthly: 2_592_000_000
    annual: 31_536_000_000
    
  data_growth:
    transaction_size_bytes: 2048      # Average transaction record
    daily_data_gb: 168.75             # 86.4M × 2KB
    monthly_data_gb: 5062.5           # 2.5B × 2KB
    retention_months: 84              # 7 years regulatory
    total_storage_tb: 425             # 7 years accumulated

# ==============================================================================
# COMPUTE COSTS
# ==============================================================================

compute:
  kubernetes:
    # Control plane
    eks_cluster:
      count: 3                        # Multi-region
      cost_per_cluster: 144           # $0.20/hr
      monthly: 432
      
    # Worker nodes - Production
    nodes_payment_service:
      instance_type: "c6i.2xlarge"
      count: 6
      on_demand_hourly: 0.34
      reserved_1yr_hourly: 0.21
      spot_hourly: 0.12
      strategy: "70% reserved, 20% on-demand, 10% spot"
      monthly_blended: 1094
      
    nodes_fraud_detection:
      instance_type: "c6i.4xlarge"
      count: 4
      on_demand_hourly: 0.68
      reserved_1yr_hourly: 0.42
      monthly_blended: 1464
      
    nodes_reconciliation:
      instance_type: "m6i.xlarge"
      count: 3
      on_demand_hourly: 0.192
      reserved_1yr_hourly: 0.12
      monthly_blended: 312
      
    nodes_general:
      instance_type: "m6i.2xlarge"
      count: 4
      monthly_blended: 832
      
    total_compute_monthly: 4134
    
  # Auto-scaling headroom
  scaling_headroom:
    percentage: 30
    additional_monthly: 1240
    
  compute_total_monthly: 5374

# ==============================================================================
# DATABASE COSTS
# ==============================================================================

database:
  cockroachdb:
    deployment: "Dedicated (self-managed on EC2)"
    
    # Primary cluster
    primary_nodes:
      instance_type: "i3.2xlarge"     # NVMe SSD for IOPS
      count: 5                        # 5-node for HA
      on_demand_hourly: 0.624
      reserved_1yr_hourly: 0.39
      monthly_blended: 1404
      
    # DR cluster
    dr_nodes:
      instance_type: "i3.xlarge"
      count: 3
      monthly_blended: 421
      
    # Storage
    ebs_storage:
      type: "io2"
      size_gb: 2000
      iops: 64000
      cost_per_gb: 0.125
      cost_per_iops: 0.065
      monthly: 4410
      
    # Backup storage
    backup_s3:
      monthly_gb: 5000
      cost_per_gb: 0.023
      monthly: 115
      
    cockroach_total: 6350
    
  redis:
    deployment: "ElastiCache"
    node_type: "r6g.xlarge"
    nodes: 6                          # 3 primary + 3 replica
    monthly_per_node: 219
    monthly_total: 1314
    
  database_total_monthly: 7664

# ==============================================================================
# MESSAGE QUEUE COSTS
# ==============================================================================

messaging:
  kafka:
    deployment: "MSK (Managed Kafka)"
    
    brokers:
      instance_type: "kafka.m5.2xlarge"
      count: 6                        # 3 AZs × 2 brokers
      monthly_per_broker: 489
      monthly_total: 2934
      
    storage:
      gb_per_broker: 1000
      retention_hours: 168            # 7 days
      cost_per_gb: 0.10
      monthly_total: 600
      
    data_transfer:
      monthly_gb: 50000
      cross_az_per_gb: 0.01
      monthly: 500
      
    kafka_total: 4034

# ==============================================================================
# NETWORKING COSTS
# ==============================================================================

networking:
  load_balancers:
    nlb:
      count: 3                        # Multi-region
      hourly: 0.0225
      monthly_fixed: 48.6
      lcu_hourly: 0.006
      estimated_lcu: 100
      monthly_total: 480
      
    alb:
      count: 2
      monthly_total: 216
      
  data_transfer:
    outbound:
      monthly_gb: 100000
      first_10tb: 0.09
      next_40tb: 0.085
      over_50tb: 0.07
      monthly: 7850
      
    cross_region:
      monthly_gb: 20000
      per_gb: 0.02
      monthly: 400
      
    vpc_endpoints:
      count: 10
      hourly: 0.01
      monthly: 72
      
  networking_total_monthly: 9018

