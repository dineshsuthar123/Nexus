# ==============================================================================
# COST SUMMARY
# ==============================================================================

summary:
  infrastructure:
    compute: 5374
    database: 7664
    messaging: 4034
    networking: 9018
    security: 1782
    observability: 2600
    disaster_recovery: 5100
    third_party: 11700
