# .golangci.yml — Nexus RTP Platform linter configuration
# Fintech-appropriate rules: strict error handling, security, performance

run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  enable:
    # Error handling (critical for financial systems)
    - errcheck       # Unchecked errors
    - errorlint      # Error wrapping consistency

    # Security
    - gosec          # Security-oriented rules

    # Bug detection
    - govet          # Go vet checks
    - staticcheck    # Advanced static analysis
    - ineffassign    # Detects useless assignments
    - typecheck      # Type checking

    # Code quality
    - unused         # Unused code
    - gofmt          # Formatting
    - goimports      # Import ordering
    - misspell       # Spelling
    - unconvert      # Unnecessary conversions

    # Performance
    - prealloc       # Preallocate slices where possible

  disable:
    # Too noisy for initial adoption
    - exhaustive
    - wrapcheck
    - nlreturn
    - wsl
    - gomnd
    - funlen
    - lll
    - godox          # Allow TODO/FIXME during development
    - depguard

linters-settings:
  errcheck:
    check-type-assertions: true
    check-blank: false

  govet:
    enable-all: true
    disable:
      - fieldalignment  # noisy, micro-optimization

  gosec:
    excludes:
      - G101  # Hardcoded credentials (too many false positives on test data)
      - G104  # Unhandled errors (covered by errcheck)
      - G304  # File path from variable (expected in config loading)

  staticcheck:
    checks: ["all", "-SA1019"]  # Allow deprecated usage during migration

  goimports:
    local-prefixes: github.com/nexus-rtp

  misspell:
    locale: US

issues:
  max-issues-per-linter: 50
  max-same-issues: 5

  exclude-rules:
    # Test files get relaxed rules
    - path: _test\.go
      linters:
        - errcheck
        - gosec
        - govet

    # Generated files
    - path: ".*\\.pb\\.go$"
      linters:
        - all

    # Allow globals in main/cmd packages
    - path: cmd/
      linters:
        - gochecknoglobals
