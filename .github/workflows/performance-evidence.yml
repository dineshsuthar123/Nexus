name: Performance evidence consistency

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify recorded metrics, documentation and frontend copies
        run: python scripts/performance/publish.py --check
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify missing and zero measurements are reported correctly
        run: node --test scripts/performance/summary.test.mjs
