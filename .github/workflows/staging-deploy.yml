# Staging Deployment Workflow — Nexus RTP Platform
# Triggered on push to main or manual dispatch
# Builds frontend + backend images, deploys to staging, runs smoke tests

name: Deploy to Staging

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Image tag to deploy (default: git SHA)'
        required: false
        type: string
      skip_smoke:
        description: 'Skip post-deploy smoke tests'
        required: false
        type: boolean
        default: false
      canary_weight:
        description: 'Canary traffic weight (0 = full deploy)'
        required: false
        type: number
        default: 0
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'services/**'
      - 'infra/helm/**'
      - 'migrations/**'

concurrency:
  group: staging-deploy
  cancel-in-progress: false  # Never cancel in-flight deploys

env:
  REGISTRY: registry.nexus-rtp.internal
  HELM_CHART: infra/helm/nexus-platform
  NAMESPACE: nexus-staging
  CLUSTER: nexus-staging-cluster

jobs:
  # ─────────────────────────────────────────────────────────
  # Stage 1: Build & Push Docker Images
  # ─────────────────────────────────────────────────────────
  build-frontend:
    name: Build Frontend Image
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Determine image tag
        id: meta
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "tag=${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "tag=staging-$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build & push frontend image
        uses: docker/build-push-action@v5
        with:
          context: frontend
          push: true
          tags: |
            ${{ env.REGISTRY }}/nexus/frontend:${{ steps.meta.outputs.tag }}
            ${{ env.REGISTRY }}/nexus/frontend:staging
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.staging.nexus-rtp.internal
            NEXT_PUBLIC_WS_URL=wss://ws.staging.nexus-rtp.internal/ws
            NEXT_PUBLIC_MOCK_MODE=false
            NEXT_PUBLIC_ENABLE_REALTIME=true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-services:
    name: Build Backend Services
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - { name: payment-service, path: services/payment-service }
          - { name: account-service, path: services/account-service }
          - { name: reconciliation-service, path: services/reconciliation-service }
          - { name: auth-service, path: services/auth-service }
          - { name: notification-service, path: services/notification-service }
          - { name: ws-gateway, path: services/ws-gateway }
    steps:
      - uses: actions/checkout@v4

      - name: Determine image tag
        id: meta
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "tag=${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "tag=staging-$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build & push ${{ matrix.service.name }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.path }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/nexus/${{ matrix.service.name }}:${{ steps.meta.outputs.tag }}
            ${{ env.REGISTRY }}/nexus/${{ matrix.service.name }}:staging
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────────────────
  # Stage 2: Database Migrations
  # ─────────────────────────────────────────────────────────
  migrate:
    name: Run Database Migrations
    needs: [build-frontend, build-services]
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Configure kubectl
        uses: azure/setup-kubectl@v3

      - name: Set kubeconfig
        run: echo "${{ secrets.STAGING_KUBECONFIG }}" | base64 -d > $HOME/.kube/config

      - name: Check current migration version
        run: |
          kubectl exec -n ${{ env.NAMESPACE }} deploy/cockroachdb-0 -- \
            cockroach sql --insecure \
            --execute="SELECT version FROM schema_migrations ORDER BY version DESC LIMIT 1;" \
            2>/dev/null || echo "No migrations table yet"

      - name: Apply migrations
        run: |
          for f in migrations/*.sql; do
            echo "Applying $f..."
            kubectl exec -n ${{ env.NAMESPACE }} deploy/cockroachdb-0 -- \
              cockroach sql --insecure --file="/migrations/$(basename $f)" || {
                echo "::error::Migration $f failed"
                exit 1
              }
          done

  # ─────────────────────────────────────────────────────────
  # Stage 3: Helm Deploy
  # ─────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Staging
    needs: [build-frontend, build-services, migrate]
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v3
        with:
          version: v3.14.0

      - name: Configure kubectl
        uses: azure/setup-kubectl@v3

      - name: Set kubeconfig
        run: echo "${{ secrets.STAGING_KUBECONFIG }}" | base64 -d > $HOME/.kube/config

      - name: Add Helm repos & update dependencies
        run: |
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo add grafana https://grafana.github.io/helm-charts
          helm repo update
          helm dependency update ${{ env.HELM_CHART }}

      - name: Deploy with Helm
        run: |
          TAG="${{ needs.build-frontend.outputs.image_tag }}"
          CANARY_WEIGHT="${{ inputs.canary_weight || '0' }}"

          CANARY_FLAG=""
          if [ "$CANARY_WEIGHT" -gt 0 ]; then
            CANARY_FLAG="--set canary.enabled=true --set canary.weight=$CANARY_WEIGHT"
          fi

          helm upgrade --install nexus ${{ env.HELM_CHART }} \
            -f ${{ env.HELM_CHART }}/values.yaml \
            -f ${{ env.HELM_CHART }}/values.staging.yaml \
            --set frontend.image.tag="$TAG" \
            --set paymentService.image.tag="$TAG" \
            --set accountService.image.tag="$TAG" \
            --set reconciliationService.image.tag="$TAG" \
            --set frontend.env.NEXTAUTH_SECRET="${{ secrets.NEXTAUTH_SECRET }}" \
            $CANARY_FLAG \
            --namespace ${{ env.NAMESPACE }} \
            --create-namespace \
            --wait \
            --timeout 10m \
            --atomic

      - name: Verify rollout
        run: |
          echo "Checking frontend rollout..."
          kubectl rollout status deployment/nexus-nexus-platform-frontend \
            -n ${{ env.NAMESPACE }} --timeout=300s

          echo "Checking payment-service rollout..."
          kubectl rollout status deployment/nexus-nexus-platform-payment-service \
            -n ${{ env.NAMESPACE }} --timeout=300s

          echo "Checking account-service rollout..."
          kubectl rollout status deployment/nexus-nexus-platform-account-service \
            -n ${{ env.NAMESPACE }} --timeout=300s

          echo "All deployments rolled out"

      - name: Deployment info
        if: always()
        run: |
          echo "## Staging Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          kubectl get pods -n ${{ env.NAMESPACE }} -o wide --no-headers | while read line; do
            POD=$(echo $line | awk '{print $1}')
            STATUS=$(echo $line | awk '{print $3}')
            echo "| $POD | $STATUS |" >> $GITHUB_STEP_SUMMARY
          done

  # ─────────────────────────────────────────────────────────
  # Stage 4: Post-Deploy Smoke Tests
  # ─────────────────────────────────────────────────────────
  smoke-test:
    name: Staging Smoke Tests
    needs: [deploy]
    if: ${{ !inputs.skip_smoke }}
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Configure kubectl
        uses: azure/setup-kubectl@v3

      - name: Set kubeconfig
        run: echo "${{ secrets.STAGING_KUBECONFIG }}" | base64 -d > $HOME/.kube/config

      - name: Run smoke tests
        run: |
          chmod +x scripts/staging-smoke-test.sh
          STAGING_URL="https://app.staging.nexus-rtp.internal" \
          API_URL="https://api.staging.nexus-rtp.internal" \
          NAMESPACE="${{ env.NAMESPACE }}" \
            scripts/staging-smoke-test.sh
        timeout-minutes: 10

      - name: Capture Grafana screenshots
        if: always()
        run: |
          GRAFANA_URL="https://grafana.staging.nexus-rtp.internal"
          DASHBOARDS=("payments-overview" "system-health" "error-rates" "latency-p99")
          mkdir -p staging-artifacts/grafana

          for dash in "${DASHBOARDS[@]}"; do
            curl -sS -o "staging-artifacts/grafana/${dash}.png" \
              "${GRAFANA_URL}/render/d/${dash}?orgId=1&from=now-30m&to=now&width=1200&height=600" \
              -H "Authorization: Bearer ${{ secrets.GRAFANA_API_KEY }}" || true
          done

      - name: Upload staging artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-smoke-results
          path: staging-artifacts/
          retention-days: 14

  # ─────────────────────────────────────────────────────────
  # Stage 5: E2E Against Staging
  # ─────────────────────────────────────────────────────────
  e2e-staging:
    name: E2E Tests (Staging)
    needs: [smoke-test]
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: frontend
        run: pnpm --filter @nexus/web exec playwright install --with-deps chromium

      - name: Run E2E tests against staging
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: https://app.staging.nexus-rtp.internal
          API_BASE_URL: https://api.staging.nexus-rtp.internal
          CI: true
        run: pnpm --filter @nexus/web test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-e2e-report
          path: frontend/apps/web/playwright-report/
          retention-days: 14

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: staging-e2e-traces
          path: frontend/apps/web/test-results/
          retention-days: 14

  # ─────────────────────────────────────────────────────────
  # Notify
  # ─────────────────────────────────────────────────────────
  notify:
    name: Post-Deploy Notification
    needs: [deploy, smoke-test, e2e-staging]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Slack notification
        if: ${{ secrets.SLACK_WEBHOOK_URL != '' }}
        uses: slackapi/slack-github-action@v1.25.0
        with:
          payload: |
            {
              "text": "Staging Deploy: ${{ needs.deploy.result == 'success' && '✅' || '❌' }} Deploy | ${{ needs.smoke-test.result == 'success' && '✅' || '⏭️' }} Smoke | ${{ needs.e2e-staging.result == 'success' && '✅' || '❌' }} E2E",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Nexus RTP Staging Deploy*\n• Deploy: ${{ needs.deploy.result }}\n• Smoke tests: ${{ needs.smoke-test.result }}\n• E2E tests: ${{ needs.e2e-staging.result }}\n• <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run>"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

      - name: Summary
        run: |
          echo "## Staging Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Stage | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Deploy | ${{ needs.deploy.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Smoke Tests | ${{ needs.smoke-test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| E2E Tests | ${{ needs.e2e-staging.result }} |" >> $GITHUB_STEP_SUMMARY
