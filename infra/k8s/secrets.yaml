# Nexus RTP Platform — Secrets & ConfigMap Templates
# IMPORTANT: This file contains TEMPLATES with placeholder values.
# Never commit real credentials. Use Vault, sealed-secrets, or external-secrets
# in production. For local Kind clusters, replace placeholders before applying.
#
# Apply: kubectl apply -f infra/k8s/secrets.yaml
---
# =============================================================================
# JWT Signing Keys (RSA-2048)
# Production: Use external-secrets-operator or Vault CSI driver
# Dev: Generate with scripts/generate-dev-keys.sh
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: jwt-signing-keys
  namespace: nexus-system
  labels:
    app.kubernetes.io/part-of: nexus-rtp
    app.kubernetes.io/component: auth
type: Opaque
data:
  # Base64-encoded RSA private key (auth-service signs tokens)
  private.pem: "REPLACE_WITH_BASE64_ENCODED_PRIVATE_KEY"
  # Base64-encoded RSA public key (all services verify tokens)
  public.pem: "REPLACE_WITH_BASE64_ENCODED_PUBLIC_KEY"

---
# =============================================================================
# MFA Encryption Key (AES-256)
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: mfa-encryption-key
  namespace: nexus-system
  labels:
    app.kubernetes.io/part-of: nexus-rtp
    app.kubernetes.io/component: auth
type: Opaque
data:
  # Base64-encoded 32-byte AES key for TOTP secret encryption
  mfa.key: "REPLACE_WITH_BASE64_ENCODED_MFA_KEY"

---
# =============================================================================
# Database Credentials
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: cockroachdb-credentials
  namespace: nexus-system
  labels:
    app.kubernetes.io/part-of: nexus-rtp
    app.kubernetes.io/component: database
type: Opaque
stringData:
  # CockroachDB connection strings
  COCKROACH_AUTH_DSN: "postgresql://nexus_auth@cockroachdb:26257/nexus_auth?sslmode=verify-full&sslrootcert=/certs/ca.crt"
  COCKROACH_LEDGER_DSN: "postgresql://nexus_ledger@cockroachdb:26257/nexus_ledger?sslmode=verify-full&sslrootcert=/certs/ca.crt"

---
# =============================================================================
# Kafka Credentials (SASL/SCRAM when enabled)
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: kafka-credentials
  namespace: nexus-system
  labels:
    app.kubernetes.io/part-of: nexus-rtp
    app.kubernetes.io/component: messaging
type: Opaque
stringData:
  KAFKA_SASL_USERNAME: "nexus-platform"
  KAFKA_SASL_PASSWORD: "REPLACE_WITH_KAFKA_PASSWORD"

---
# =============================================================================
# Shared Platform ConfigMap
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: nexus-platform-config
  namespace: nexus-system
  labels:
    app.kubernetes.io/part-of: nexus-rtp
data:
  # Kafka broker addresses
  KAFKA_BROKERS: "kafka-0.kafka-headless.nexus-data:9092,kafka-1.kafka-headless.nexus-data:9092,kafka-2.kafka-headless.nexus-data:9092"
  # Redis address
  REDIS_URL: "redis://redis.nexus-data:6379"
  # Jaeger tracing endpoint
  JAEGER_ENDPOINT: "http://jaeger-collector.nexus-monitoring:14268/api/traces"
  # Log level
  LOG_LEVEL: "info"
  # Environment
  ENVIRONMENT: "production"
  # Watchman endpoint
  WATCHMAN_URL: "http://watchman.nexus-system:8084"

---
# =============================================================================
# RBAC — ServiceAccount + Role for platform services
# =============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nexus-service-account
  namespace: nexus-system
  labels:
    app.kubernetes.io/part-of: nexus-rtp

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: nexus-service-role
  namespace: nexus-system
rules:
  # Read ConfigMaps and Secrets (mounted as env/volumes)
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get", "list", "watch"]
  # Read own pod info (for leader election, health)
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  # Events (for recording audit events)
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: nexus-service-binding
  namespace: nexus-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: nexus-service-role
subjects:
  - kind: ServiceAccount
    name: nexus-service-account
    namespace: nexus-system
