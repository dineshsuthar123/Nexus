# Alertmanager configuration for Nexus RTP Platform
# Routes alerts from Prometheus to appropriate receivers

global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'severity', 'service']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'default'

  routes:
    # Critical alerts (payment failures, data integrity) — immediate
    - match:
        severity: critical
      receiver: 'critical-alerts'
      repeat_interval: 15m
      continue: true

    # Warning alerts (latency, error budget burn) — batched
    - match:
        severity: warning
      receiver: 'warning-alerts'
      repeat_interval: 1h

receivers:
  # Default receiver — logs to stdout (always available)
  - name: 'default'
    webhook_configs:
      - url: 'http://localhost:9095/webhook'
        send_resolved: true

  # Critical: Slack + PagerDuty (configure via env vars in production)
  - name: 'critical-alerts'
    # In production, uncomment and configure:
    # slack_configs:
    #   - api_url: '{{ env "SLACK_WEBHOOK_URL" }}'
    #     channel: '#platform-critical'
    #     title: '[{{ .Status | toUpper }}] {{ .GroupLabels.alertname }}'
    #     text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'
    # pagerduty_configs:
    #   - service_key: '{{ env "PAGERDUTY_SERVICE_KEY" }}'
    webhook_configs:
      - url: 'http://localhost:9095/webhook'
        send_resolved: true

  # Warnings: Slack only
  - name: 'warning-alerts'
    # In production, uncomment and configure:
    # slack_configs:
    #   - api_url: '{{ env "SLACK_WEBHOOK_URL" }}'
    #     channel: '#platform-alerts'
    webhook_configs:
      - url: 'http://localhost:9095/webhook'
        send_resolved: true

# Inhibition rules — suppress lower-severity alerts when critical is firing
inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'service']
