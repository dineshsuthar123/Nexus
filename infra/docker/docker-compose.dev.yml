# =============================================================================
# Nexus RTP - Development Docker Compose (Frontend + Backend)
#
# Brings up the full stack for local development:
# - Frontend (Next.js with hot reload)
# - Backend services via existing docker-compose.yml
# =============================================================================

version: "3.9"

services:
  # ─────────────────────────────────────────────────
  # Frontend (Next.js Dev Server with hot reload)
  # ─────────────────────────────────────────────────
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      target: deps  # Use deps stage for dev
    command: sh -c "cd apps/web && npx next dev -p 3000"
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://kong:8000
      - NEXT_PUBLIC_WS_URL=ws://ws-gateway:8089/ws
      - NEXT_PUBLIC_MOCK_MODE=false
      - NEXT_PUBLIC_ENABLE_REALTIME=true
      - NEXT_PUBLIC_ENABLE_MFA=true
      - NEXTAUTH_URL=http://localhost:3000
      - NEXTAUTH_SECRET=dev-secret-change-in-production
    volumes:
      - ../frontend/apps/web/src:/app/apps/web/src
      - ../frontend/packages/ui/src:/app/packages/ui/src
    depends_on:
      - kong
    networks:
      - nexus-network

  # ─────────────────────────────────────────────────
  # Storybook Dev Server
  # ─────────────────────────────────────────────────
  storybook:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      target: deps
    command: sh -c "cd packages/ui && npx storybook dev -p 6006 --no-open"
    ports:
      - "6006:6006"
    volumes:
      - ../frontend/packages/ui/src:/app/packages/ui/src
    networks:
      - nexus-network

networks:
  nexus-network:
    external: true
    name: docker_nexus-network
