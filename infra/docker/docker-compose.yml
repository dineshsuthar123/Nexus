# Nexus - Global Real-Time Payment Network
# Docker Compose for Local Development
#
# Usage:
#   docker compose up -d        # Start all services
#   docker compose logs -f      # View logs
#   docker compose down -v      # Stop and remove volumes

version: "3.9"

x-common-variables: &common-env
  TZ: UTC
  LOG_LEVEL: debug

services:
  # ============================================================================
  # CockroachDB Cluster - Distributed SQL Ledger
  # ============================================================================
  cockroachdb-1:
    image: cockroachdb/cockroach:v23.2.0
    container_name: nexus-cockroachdb-1
    hostname: cockroachdb-1
    command: start --insecure --join=cockroachdb-1,cockroachdb-2,cockroachdb-3 --listen-addr=0.0.0.0:26257 --http-addr=0.0.0.0:8080 --locality=region=us-east-1,zone=us-east-1a
    ports:
      - "26257:26257"
      - "8080:8080"
    volumes:
      - cockroach-data-1:/cockroach/cockroach-data
      - ./cockroachdb/init:/docker-entrypoint-initdb.d:ro
    networks:
      - nexus-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  cockroachdb-2:
    image: cockroachdb/cockroach:v23.2.0
    container_name: nexus-cockroachdb-2
    hostname: cockroachdb-2
    command: start --insecure --join=cockroachdb-1,cockroachdb-2,cockroachdb-3 --listen-addr=0.0.0.0:26257 --http-addr=0.0.0.0:8080 --locality=region=eu-central-1,zone=eu-central-1a
    volumes:
      - cockroach-data-2:/cockroach/cockroach-data
    networks:
      - nexus-network
    depends_on:
      - cockroachdb-1

  cockroachdb-3:
    image: cockroachdb/cockroach:v23.2.0
    container_name: nexus-cockroachdb-3
    hostname: cockroachdb-3
    command: start --insecure --join=cockroachdb-1,cockroachdb-2,cockroachdb-3 --listen-addr=0.0.0.0:26257 --http-addr=0.0.0.0:8080 --locality=region=ap-southeast-1,zone=ap-southeast-1a
    volumes:
      - cockroach-data-3:/cockroach/cockroach-data
    networks:
      - nexus-network
    depends_on:
      - cockroachdb-1

  # Initialize CockroachDB cluster
  cockroachdb-init:
    image: cockroachdb/cockroach:v23.2.0
    container_name: nexus-cockroachdb-init
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "
        sleep 10 &&
        cockroach init --insecure --host=cockroachdb-1:26257 || true &&
        sleep 5 &&
        cockroach sql --insecure --host=cockroachdb-1:26257 < /docker-entrypoint-initdb.d/001_init_schema.sql &&
        cockroach sql --insecure --host=cockroachdb-1:26257 --database=nexus_ledger < /docker-entrypoint-initdb.d/002_cdc_setup.sql &&
        cockroach sql --insecure --host=cockroachdb-1:26257 --database=nexus_ledger < /docker-entrypoint-initdb.d/003_seed_local.sql
      "
    volumes:
      - ./cockroachdb/init:/docker-entrypoint-initdb.d:ro
    networks:
      - nexus-network
    depends_on:
      - cockroachdb-1
      - cockroachdb-2
      - cockroachdb-3

  # ============================================================================
  # Apache Kafka - Event Backbone
  # ============================================================================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: nexus-zookeeper
    hostname: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-logs:/var/lib/zookeeper/log
    networks:
      - nexus-network
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka-1:
    image: confluentinc/cp-kafka:7.5.0
    container_name: nexus-kafka-1
    hostname: kafka-1
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_NUM_PARTITIONS: 12
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
    volumes:
      - kafka-data-1:/var/lib/kafka/data
    networks:
      - nexus-network
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 5

  kafka-2:
    image: confluentinc/cp-kafka:7.5.0
    container_name: nexus-kafka-2
    hostname: kafka-2
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9093:9093"
    environment:
      KAFKA_BROKER_ID: 2
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:29092,PLAINTEXT_HOST://localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_NUM_PARTITIONS: 12
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
    volumes:
      - kafka-data-2:/var/lib/kafka/data
    networks:
      - nexus-network

  kafka-3:
    image: confluentinc/cp-kafka:7.5.0
    container_name: nexus-kafka-3
    hostname: kafka-3
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9094:9094"
    environment:
      KAFKA_BROKER_ID: 3
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-3:29092,PLAINTEXT_HOST://localhost:9094
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_NUM_PARTITIONS: 12
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
    volumes:
      - kafka-data-3:/var/lib/kafka/data
    networks:
      - nexus-network

  # Kafka topic initialization
  kafka-init:
    image: confluentinc/cp-kafka:7.5.0
    container_name: nexus-kafka-init
    depends_on:
      kafka-1:
        condition: service_healthy
    command: >
      /bin/bash -c "
        echo 'Waiting for Kafka to be ready...' &&
        sleep 30 &&
        kafka-topics --bootstrap-server kafka-1:29092 --create --if-not-exists --topic nexus.events.raw --partitions 12 --replication-factor 3 &&
        kafka-topics --bootstrap-server kafka-1:29092 --create --if-not-exists --topic nexus.payments.initiated --partitions 12 --replication-factor 3 &&
        kafka-topics --bootstrap-server kafka-1:29092 --create --if-not-exists --topic nexus.payments.enriched --partitions 12 --replication-factor 3 &&
        kafka-topics --bootstrap-server kafka-1:29092 --create --if-not-exists --topic nexus.payments.completed --partitions 12 --replication-factor 3 &&
        kafka-topics --bootstrap-server kafka-1:29092 --create --if-not-exists --topic nexus.fraud.alerts --partitions 6 --replication-factor 3 &&
        kafka-topics --bootstrap-server kafka-1:29092 --create --if-not-exists --topic nexus.sanctions.results --partitions 6 --replication-factor 3 &&
        kafka-topics --bootstrap-server kafka-1:29092 --create --if-not-exists --topic nexus.reconciliation.events --partitions 6 --replication-factor 3 &&
        kafka-topics --bootstrap-server kafka-1:29092 --create --if-not-exists --topic nexus.notifications --partitions 6 --replication-factor 3 &&
        kafka-topics --bootstrap-server kafka-1:29092 --create --if-not-exists --topic nexus.outbox.events --partitions 12 --replication-factor 3 &&
        echo 'Topics created successfully!'
      "
    networks:
      - nexus-network

  # Kafka UI for management
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.1
    container_name: nexus-kafka-ui
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: nexus-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-1:29092,kafka-2:29092,kafka-3:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
      DYNAMIC_CONFIG_ENABLED: "true"
    networks:
      - nexus-network
    depends_on:
      - kafka-1
      - kafka-2
      - kafka-3

  # ============================================================================
  # Debezium Connect - CDC for Outbox Pattern
  # ============================================================================
  debezium-connect:
    image: debezium/connect:2.4
    container_name: nexus-debezium
    hostname: debezium-connect
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka-1:29092,kafka-2:29092,kafka-3:29092
      GROUP_ID: nexus-debezium-connect
      CONFIG_STORAGE_TOPIC: nexus.debezium.configs
      OFFSET_STORAGE_TOPIC: nexus.debezium.offsets
      STATUS_STORAGE_TOPIC: nexus.debezium.status
      CONFIG_STORAGE_REPLICATION_FACTOR: 3
      OFFSET_STORAGE_REPLICATION_FACTOR: 3
      STATUS_STORAGE_REPLICATION_FACTOR: 3
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      ENABLE_DEBEZIUM_SCRIPTING: "true"
    volumes:
      - ./debezium/connectors:/kafka/connect/connectors:ro
    networks:
      - nexus-network
    depends_on:
      kafka-1:
        condition: service_healthy

  # ============================================================================
  # Apache Flink - Stream Processing
  # ============================================================================
  flink-jobmanager:
    image: flink:1.18-java17
    container_name: nexus-flink-jobmanager
    hostname: flink-jobmanager
    ports:
      - "8082:8081"
      - "6123:6123"
    command: jobmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
        state.backend: rocksdb
        state.checkpoints.dir: file:///flink-checkpoints
        execution.checkpointing.interval: 60000
        execution.checkpointing.mode: EXACTLY_ONCE
        taskmanager.numberOfTaskSlots: 4
        parallelism.default: 4
    volumes:
      - flink-checkpoints:/flink-checkpoints
      - ../../flink-jobs/fraud-detection/target:/opt/flink/jobs:ro
    networks:
      - nexus-network

  flink-taskmanager-1:
    image: flink:1.18-java17
    container_name: nexus-flink-taskmanager-1
    hostname: flink-taskmanager-1
    depends_on:
      - flink-jobmanager
    command: taskmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
        state.backend: rocksdb
        taskmanager.numberOfTaskSlots: 4
        taskmanager.memory.process.size: 2g
    volumes:
      - flink-checkpoints:/flink-checkpoints
    networks:
      - nexus-network

  flink-taskmanager-2:
    image: flink:1.18-java17
    container_name: nexus-flink-taskmanager-2
    hostname: flink-taskmanager-2
    depends_on:
      - flink-jobmanager
    command: taskmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
        state.backend: rocksdb
        taskmanager.numberOfTaskSlots: 4
        taskmanager.memory.process.size: 2g
    volumes:
      - flink-checkpoints:/flink-checkpoints
    networks:
      - nexus-network

  # ============================================================================
  # Redis - Caching and Rate Limiting
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: nexus-redis
    hostname: redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-NxR3d1sSecur3Pass} --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - nexus-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-NxR3d1sSecur3Pass}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================================
  # Kong API Gateway
  # ============================================================================
  kong-database:
    image: postgres:15-alpine
    container_name: nexus-kong-db
    hostname: kong-database
    environment:
      POSTGRES_USER: kong
      POSTGRES_PASSWORD: ${KONG_PG_PASSWORD:-NxK0ngSecur3Db2026}
      POSTGRES_DB: kong
    volumes:
      - kong-db-data:/var/lib/postgresql/data
    networks:
      - nexus-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kong"]
      interval: 10s
      timeout: 5s
      retries: 5

  kong-migrations:
    image: kong:3.5
    container_name: nexus-kong-migrations
    command: kong migrations bootstrap
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-database
      KONG_PG_USER: kong
      KONG_PG_PASSWORD: ${KONG_PG_PASSWORD:-NxK0ngSecur3Db2026}
    networks:
      - nexus-network
    depends_on:
      kong-database:
        condition: service_healthy

  kong:
    image: kong:3.5
    container_name: nexus-kong
    hostname: kong
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-database
      KONG_PG_USER: kong
      KONG_PG_PASSWORD: ${KONG_PG_PASSWORD:-NxK0ngSecur3Db2026}
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001, 0.0.0.0:8444 ssl
      KONG_PROXY_LISTEN: 0.0.0.0:8000, 0.0.0.0:8443 ssl
      KONG_DNS_RESOLVER: 127.0.0.11:53
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_DNS_VALID_TTL: 5
      KONG_DNS_STALE_TTL: 0
      KONG_DNS_NOT_FOUND_TTL: 1
      KONG_DNS_ERROR_TTL: 1
    ports:
      - "8000:8000"   # Proxy
      - "8443:8443"   # Proxy SSL
      - "8001:8001"   # Admin API
      - "8444:8444"   # Admin SSL
    networks:
      - nexus-network
    depends_on:
      kong-migrations:
        condition: service_completed_successfully
      kong-database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 10s
      retries: 5

  # ============================================================================
  # Moov Watchman - OFAC Sanctions Screening
  # ============================================================================
  watchman:
    image: moov/watchman:v0.30.0
    container_name: nexus-watchman
    hostname: watchman
    ports:
      - "8084:8084"
      - "19094:9094"
    environment:
      LOG_FORMAT: json
      HTTP_BIND_ADDRESS: ":8084"
      ADMIN_BIND_ADDRESS: ":9094"
      DATABASE_TYPE: "sqlite"
      WEBHOOK_MAX_WORKERS: "4"
    networks:
      - nexus-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8084/ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================================
  # Monitoring Stack
  # ============================================================================
  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: nexus-prometheus
    hostname: prometheus
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../../infra/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ../../infra/prometheus/slo-rules.yml:/etc/prometheus/slo-rules.yml:ro
      - prometheus-data:/prometheus
    networks:
      - nexus-network

  alertmanager:
    image: prom/alertmanager:v0.26.0
    container_name: nexus-alertmanager
    hostname: alertmanager
    ports:
      - "19093:9093"
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    networks:
      - nexus-network
    depends_on:
      - prometheus

  grafana:
    image: grafana/grafana:10.2.0
    container_name: nexus-grafana
    hostname: grafana
    ports:
      - "3002:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD:-changeme}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - nexus-network
    depends_on:
      - prometheus

  # Jaeger for distributed tracing
  jaeger:
    image: jaegertracing/all-in-one:1.51
    container_name: nexus-jaeger
    hostname: jaeger
    ports:
      - "16686:16686"  # UI
      - "6831:6831/udp"  # Thrift compact
      - "14268:14268"  # HTTP collector
      - "4317:4317"    # OTLP gRPC
      - "4318:4318"    # OTLP HTTP
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    networks:
      - nexus-network

  # ============================================================================
  # Go Services (profiles for optional startup)
  # ============================================================================
  payment-service:
    build:
      context: ../../services/payment-service
      dockerfile: Dockerfile
      additional_contexts:
        idempotency: ../../pkg/idempotency
    container_name: nexus-payment-service
    hostname: payment-service
    profiles:
      - services
    ports:
      - "8085:8080"
    environment:
      <<: *common-env
      DATABASE_URL: postgresql://root@cockroachdb-1:26257/nexus_ledger?sslmode=disable
      KAFKA_BROKERS: kafka-1:29092,kafka-2:29092,kafka-3:29092
      REDIS_URL: redis://:${REDIS_PASSWORD:-NxR3d1sSecur3Pass}@redis:6379
      IDEMPOTENCY_TTL_SECONDS: "86400"
      WATCHMAN_URL: http://watchman:8084
      JAEGER_ENDPOINT: jaeger:4318
    networks:
      - nexus-network
    depends_on:
      cockroachdb-1:
        condition: service_healthy
      kafka-1:
        condition: service_healthy
      redis:
        condition: service_healthy

  account-service:
    build:
      context: ../../services/account-service
      dockerfile: Dockerfile
      additional_contexts:
        idempotency: ../../pkg/idempotency
    container_name: nexus-account-service
    hostname: account-service
    profiles:
      - services
    ports:
      - "8086:8080"
    environment:
      <<: *common-env
      SERVER_PORT: "8080"
      DATABASE_URL: postgresql://root@cockroachdb-1:26257/nexus_ledger?sslmode=disable
      KAFKA_BROKERS: kafka-1:29092,kafka-2:29092,kafka-3:29092
      REDIS_URL: redis://:${REDIS_PASSWORD:-NxR3d1sSecur3Pass}@redis:6379
      IDEMPOTENCY_TTL_SECONDS: "86400"
      JAEGER_ENDPOINT: jaeger:4318
    networks:
      - nexus-network
    depends_on:
      cockroachdb-1:
        condition: service_healthy
      kafka-1:
        condition: service_healthy
      redis:
        condition: service_healthy

  reconciliation-service:
    build:
      context: ../../services/reconciliation-service
      dockerfile: Dockerfile
      additional_contexts:
        idempotency: ../../pkg/idempotency
    container_name: nexus-reconciliation-service
    hostname: reconciliation-service
    profiles:
      - services
    ports:
      - "8087:8080"
    environment:
      <<: *common-env
      SERVER_PORT: "8080"
      DATABASE_URL: postgresql://root@cockroachdb-1:26257/nexus_ledger?sslmode=disable
      KAFKA_BROKERS: kafka-1:29092,kafka-2:29092,kafka-3:29092
      REDIS_URL: redis://redis:6379
      IDEMPOTENCY_TTL_SECONDS: "86400"
      JAEGER_ENDPOINT: jaeger:4318
    networks:
      - nexus-network
    depends_on:
      cockroachdb-1:
        condition: service_healthy
      kafka-1:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ============================================================================
  # Auth Service - JWT, MFA, Password Reset
  # ============================================================================
  auth-service:
    build:
      context: ../../services/auth-service
      dockerfile: Dockerfile
    container_name: nexus-auth-service
    hostname: auth-service
    profiles:
      - services
    ports:
      - "8088:8080"
    environment:
      <<: *common-env
      PORT: "8080"
      DATABASE_URL: postgresql://root@cockroachdb-1:26257/nexus_auth?sslmode=disable
      REDIS_URL: redis://:${REDIS_PASSWORD:-NxR3d1sSecur3Pass}@redis:6379
      JWT_PRIVATE_KEY_PATH: /app/keys/dev_private.pem
      JWT_PUBLIC_KEY_PATH: /app/keys/dev_public.pem
      JWT_ISSUER: nexus-rtp
      JWT_ACCESS_TOKEN_EXPIRY: 15m
      JWT_REFRESH_TOKEN_EXPIRY: 168h
      MFA_ISSUER: NexusRTP
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:-01234567890123456789012345678901}
      JAEGER_ENDPOINT: jaeger:4318
      # SMTP email transport (disabled in dev — uses NoopSender that logs)
      SMTP_ENABLED: "false"
      SMTP_HOST: "mailhog"
      SMTP_PORT: "1025"
      SMTP_FROM_ADDRESS: "noreply@nexusrtp.com"
      SMTP_FROM_NAME: "Nexus RTP"
      SMTP_BASE_URL: "http://localhost:3000"
    volumes:
      - ../../services/auth-service/keys:/app/keys:ro
    networks:
      - nexus-network
    depends_on:
      cockroachdb-1:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ============================================================================
  # WebSocket Gateway - Real-time event streaming
  # ============================================================================
  ws-gateway:
    build:
      context: ../../services/ws-gateway
      dockerfile: Dockerfile
    container_name: nexus-ws-gateway
    hostname: ws-gateway
    profiles:
      - services
    ports:
      - "8089:8080"
    environment:
      <<: *common-env
      PORT: "8080"
      KAFKA_BROKERS: kafka-1:29092,kafka-2:29092,kafka-3:29092
      KAFKA_TOPICS: nexus.payments.status,nexus.events.raw,nexus.notifications,nexus.reconciliation.events,nexus.fraud.alerts
      KAFKA_GROUP_ID: ws-gateway
      JWT_PUBLIC_KEY_PATH: /app/keys/dev_public.pem
      ALLOWED_ORIGINS: "http://localhost:3000,http://localhost:3001"
      WS_PING_INTERVAL: 30
      WS_PONG_TIMEOUT: 10
    volumes:
      - ../../services/ws-gateway/keys:/app/keys:ro
    networks:
      - nexus-network
    depends_on:
      kafka-1:
        condition: service_healthy
      auth-service:
        condition: service_healthy

  # ============================================================================
  # Analytics Service - Platform metrics and trends
  # ============================================================================
  analytics-service:
    build:
      context: ../../services/analytics-service
      dockerfile: Dockerfile
    container_name: nexus-analytics-service
    hostname: analytics-service
    profiles:
      - services
    ports:
      - "8093:8080"
    environment:
      <<: *common-env
      PORT: "8080"
      DATABASE_URL: postgresql://root@cockroachdb-1:26257/nexus_ledger?sslmode=disable
    networks:
      - nexus-network
    depends_on:
      cockroachdb-1:
        condition: service_healthy

  # ============================================================================
  # Audit Service - Cryptographic audit bundle generation
  # ============================================================================
  audit-service:
    build:
      context: ../../services/audit-service
      dockerfile: Dockerfile
    container_name: nexus-audit-service
    hostname: audit-service
    profiles:
      - services
    ports:
      - "8091:8080"
    environment:
      <<: *common-env
      PORT: "8080"
      DATABASE_URL: postgresql://root@cockroachdb-1:26257/nexus_ledger?sslmode=disable
    networks:
      - nexus-network
    depends_on:
      cockroachdb-1:
        condition: service_healthy

  # ============================================================================
  # Notification Service - Notification management & delivery
  # ============================================================================
  notification-service:
    build:
      context: ../../services/notification-service
      dockerfile: Dockerfile
    container_name: nexus-notification-service
    hostname: notification-service
    profiles:
      - services
    ports:
      - "8092:8080"
    environment:
      <<: *common-env
      PORT: "8080"
      DATABASE_URL: postgresql://root@cockroachdb-1:26257/nexus_ledger?sslmode=disable
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka-1:29092
      KAFKA_TOPIC: nexus.notifications
      SMTP_ENABLED: "false"
      JAEGER_ENDPOINT: jaeger:4318
    networks:
      - nexus-network
    depends_on:
      cockroachdb-1:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka-1:
        condition: service_healthy

  # ============================================================================
  # Kong Route Init - Configures API gateway routes
  # ============================================================================
  kong-init:
    image: curlimages/curl:8.5.0
    container_name: nexus-kong-init
    profiles:
      - services
    entrypoint: /bin/sh
    command:
      - -c
      - |
        echo "Waiting for Kong Admin API..."
        until curl -s http://kong:8001/status > /dev/null 2>&1; do sleep 2; done
        echo "Kong is ready. Configuring routes..."

        # Auth service
        curl -s -X PUT http://kong:8001/services/auth-service -d name=auth-service -d url=http://auth-service:8080
        curl -s -X PUT http://kong:8001/services/auth-service/routes/auth-routes -d "name=auth-routes" -d "paths[]=/api/v1/auth" -d "strip_path=false"
        curl -s -X PUT http://kong:8001/services/auth-service/routes/user-routes -d "name=user-routes" -d "paths[]=/api/v1/users" -d "strip_path=false"

        # Payment service
        curl -s -X PUT http://kong:8001/services/payment-service -d name=payment-service -d url=http://payment-service:8080
        curl -s -X PUT http://kong:8001/services/payment-service/routes/payment-routes -d "name=payment-routes" -d "paths[]=/api/v1/payments" -d "strip_path=false"
        curl -s -X PUT http://kong:8001/services/payment-service/routes/message-routes -d "name=message-routes" -d "paths[]=/api/v1/messages" -d "strip_path=false"

        # Account service
        curl -s -X PUT http://kong:8001/services/account-service -d name=account-service -d url=http://account-service:8080
        curl -s -X PUT http://kong:8001/services/account-service/routes/account-routes -d "name=account-routes" -d "paths[]=/api/v1/accounts" -d "strip_path=false"
        curl -s -X PUT http://kong:8001/services/account-service/routes/customer-routes -d "name=customer-routes" -d "paths[]=/api/v1/customers" -d "strip_path=false"

        # Reconciliation service
        curl -s -X PUT http://kong:8001/services/reconciliation-service -d name=reconciliation-service -d url=http://reconciliation-service:8080
        curl -s -X PUT http://kong:8001/services/reconciliation-service/routes/reconciliation-routes -d "name=reconciliation-routes" -d "paths[]=/api/v1/reconciliation" -d "strip_path=false"

        # Analytics service
        curl -s -X PUT http://kong:8001/services/analytics-service -d name=analytics-service -d url=http://analytics-service:8080
        curl -s -X PUT http://kong:8001/services/analytics-service/routes/analytics-routes -d "name=analytics-routes" -d "paths[]=/api/v1/analytics" -d "strip_path=false"

        # Audit service
        curl -s -X PUT http://kong:8001/services/audit-service -d name=audit-service -d url=http://audit-service:8080
        curl -s -X PUT http://kong:8001/services/audit-service/routes/audit-routes -d "name=audit-routes" -d "paths[]=/api/v1/audit" -d "strip_path=false"

        # Notification service
        curl -s -X PUT http://kong:8001/services/notification-service -d name=notification-service -d url=http://notification-service:8080
        curl -s -X PUT http://kong:8001/services/notification-service/routes/notification-routes -d "name=notification-routes" -d "paths[]=/api/v1/notifications" -d "strip_path=false"

        # WebSocket gateway
        curl -s -X PUT http://kong:8001/services/ws-gateway -d name=ws-gateway -d url=http://ws-gateway:8080
        curl -s -X PUT http://kong:8001/services/ws-gateway/routes/ws-route -d "name=ws-route" -d "paths[]=/ws" -d "strip_path=false"

        # CORS plugin
        curl -s -X POST http://kong:8001/plugins -d name=cors \
          -d "config.origins[]=http://localhost:3000" -d "config.origins[]=http://localhost:3001" \
          -d "config.methods[]=GET" -d "config.methods[]=POST" -d "config.methods[]=PUT" \
          -d "config.methods[]=PATCH" -d "config.methods[]=DELETE" -d "config.methods[]=OPTIONS" \
          -d "config.headers[]=Authorization" -d "config.headers[]=Content-Type" \
          -d "config.headers[]=X-Request-ID" -d "config.headers[]=X-Idempotency-Key" \
          -d "config.credentials=true" -d "config.max_age=3600" 2>/dev/null || true

        echo "Kong routing configured successfully!"
        curl -s http://kong:8001/routes | grep -o '"name":"[^"]*"' | sort
    networks:
      - nexus-network
    depends_on:
      kong:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
      account-service:
        condition: service_healthy
      reconciliation-service:
        condition: service_healthy
      analytics-service:
        condition: service_healthy
      audit-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
      ws-gateway:
        condition: service_healthy

  # ============================================================================
  # Frontend - Next.js Web Application
  # ============================================================================
  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    container_name: nexus-frontend
    hostname: frontend
    profiles:
      - frontend
    ports:
      - "3001:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      API_INTERNAL_URL: http://kong:8000
      NEXT_PUBLIC_WS_URL: ws://localhost:8089/ws
      NEXTAUTH_URL: http://localhost:3001
      NEXTAUTH_SECRET: nexus-dev-secret-change-in-production
    networks:
      - nexus-network
    depends_on:
      kong:
        condition: service_healthy

# ============================================================================
# Networks
# ============================================================================
networks:
  nexus-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

# ============================================================================
# Volumes
# ============================================================================
volumes:
  cockroach-data-1:
  cockroach-data-2:
  cockroach-data-3:
  zookeeper-data:
  zookeeper-logs:
  kafka-data-1:
  kafka-data-2:
  kafka-data-3:
  redis-data:
  kong-db-data:
  prometheus-data:
  grafana-data:
  flink-checkpoints:
