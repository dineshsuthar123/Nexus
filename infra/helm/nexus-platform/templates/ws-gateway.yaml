{{- if .Values.wsGateway.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nexus-platform.wsGateway.fullname" . }}
  labels:
    {{- include "nexus-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: ws-gateway
spec:
  {{- if not .Values.wsGateway.autoscaling.enabled }}
  replicas: {{ .Values.wsGateway.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "nexus-platform.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: ws-gateway
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
      labels:
        {{- include "nexus-platform.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: ws-gateway
    spec:
      serviceAccountName: {{ include "nexus-platform.fullname" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: ws-gateway
          image: "{{ .Values.wsGateway.image.repository }}:{{ .Values.wsGateway.image.tag }}"
          imagePullPolicy: {{ .Values.wsGateway.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: KAFKA_BROKERS
              value: {{ include "nexus-platform.kafkaBrokers" . | quote }}
            - name: KAFKA_TOPICS
              value: {{ .Values.wsGateway.env.KAFKA_TOPICS | quote }}
            - name: KAFKA_GROUP_ID
              value: {{ .Values.wsGateway.env.KAFKA_GROUP_ID | quote }}
            - name: JWT_PUBLIC_KEY_PATH
              value: "/app/keys/public.pem"
            - name: ALLOWED_ORIGINS
              value: "https://app.nexus-rtp.com"
            - name: WS_PING_INTERVAL
              value: {{ .Values.wsGateway.env.WS_PING_INTERVAL | quote }}
            - name: WS_PONG_TIMEOUT
              value: {{ .Values.wsGateway.env.WS_PONG_TIMEOUT | quote }}
            - name: ENVIRONMENT
              value: "production"
          volumeMounts:
            - name: jwt-public-key
              mountPath: /app/keys
              readOnly: true
          {{- with .Values.wsGateway.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.wsGateway.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.wsGateway.resources | nindent 12 }}
      volumes:
        - name: jwt-public-key
          secret:
            secretName: {{ include "nexus-platform.fullname" . }}-jwt-keys
            items:
              - key: public.pem
                path: public.pem
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/component: ws-gateway
                topologyKey: kubernetes.io/hostname
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "nexus-platform.wsGateway.fullname" . }}
  labels:
    {{- include "nexus-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: ws-gateway
spec:
  type: {{ .Values.wsGateway.service.type }}
  ports:
    - port: {{ .Values.wsGateway.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "nexus-platform.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: ws-gateway
{{- if .Values.wsGateway.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "nexus-platform.wsGateway.fullname" . }}
  labels:
    {{- include "nexus-platform.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "nexus-platform.wsGateway.fullname" . }}
  minReplicas: {{ .Values.wsGateway.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.wsGateway.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.wsGateway.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
{{- end }}
