{{- if .Values.accountService.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nexus-platform.accountService.fullname" . }}
  labels:
    {{- include "nexus-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: account-service
spec:
  {{- if not .Values.accountService.autoscaling.enabled }}
  replicas: {{ .Values.accountService.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "nexus-platform.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: account-service
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8081"
        prometheus.io/path: "/metrics"
      labels:
        {{- include "nexus-platform.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: account-service
    spec:
      serviceAccountName: {{ include "nexus-platform.fullname" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: account-service
          image: "{{ .Values.accountService.image.repository }}:{{ .Values.accountService.image.tag }}"
          imagePullPolicy: {{ .Values.accountService.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8081
              protocol: TCP
          env:
            - name: DATABASE_URL
              value: {{ include "nexus-platform.databaseUrl" . | quote }}
            - name: REDIS_URL
              value: {{ include "nexus-platform.redisUrl" . | quote }}
            - name: JAEGER_ENDPOINT
              value: "http://jaeger:14268/api/traces"
            - name: ENVIRONMENT
              value: "production"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.accountService.resources | nindent 12 }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/component: account-service
                topologyKey: kubernetes.io/hostname
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "nexus-platform.accountService.fullname" . }}
  labels:
    {{- include "nexus-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: account-service
spec:
  type: {{ .Values.accountService.service.type }}
  ports:
    - port: {{ .Values.accountService.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "nexus-platform.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: account-service
{{- if .Values.accountService.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "nexus-platform.accountService.fullname" . }}
  labels:
    {{- include "nexus-platform.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "nexus-platform.accountService.fullname" . }}
  minReplicas: {{ .Values.accountService.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.accountService.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.accountService.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
{{- end }}
