{{/*
Fraud Detection (Flink) Kubernetes Deployment
Real-time fraud detection using Apache Flink CEP
*/}}
{{- if .Values.fraudDetection.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nexus.fullname" . }}-flink-jobmanager
  labels:
    {{- include "nexus.labels" . | nindent 4 }}
    app.kubernetes.io/component: flink-jobmanager
spec:
  replicas: {{ .Values.fraudDetection.jobManager.replicas }}
  selector:
    matchLabels:
      {{- include "nexus.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: flink-jobmanager
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9249"
      labels:
        {{- include "nexus.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: flink-jobmanager
    spec:
      serviceAccountName: {{ include "nexus.serviceAccountName" . }}
      containers:
        - name: jobmanager
          image: "{{ .Values.fraudDetection.image.repository }}:{{ .Values.fraudDetection.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.fraudDetection.image.pullPolicy }}
          args: ["jobmanager"]
          ports:
            - name: rpc
              containerPort: 6123
            - name: blob
              containerPort: 6124
            - name: ui
              containerPort: 8081
            - name: metrics
              containerPort: 9249
          env:
            - name: FLINK_PROPERTIES
              value: |
                jobmanager.rpc.address: {{ include "nexus.fullname" . }}-flink-jobmanager
                jobmanager.rpc.port: 6123
                blob.server.port: 6124
                taskmanager.numberOfTaskSlots: 4
                parallelism.default: 2
                state.backend: rocksdb
                state.checkpoints.dir: file:///flink-data/checkpoints
                state.savepoints.dir: file:///flink-data/savepoints
                metrics.reporters: prom
                metrics.reporter.prom.class: org.apache.flink.metrics.prometheus.PrometheusReporter
                metrics.reporter.prom.port: 9249
            - name: KAFKA_BROKERS
              value: {{ include "nexus.kafkaUrl" . }}
          resources:
            {{- toYaml .Values.fraudDetection.jobManager.resources | nindent 12 }}
          livenessProbe:
            tcpSocket:
              port: 6123
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /overview
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 10
          volumeMounts:
            - name: flink-data
              mountPath: /flink-data
      volumes:
        - name: flink-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "nexus.fullname" . }}-flink-jobmanager
  labels:
    {{- include "nexus.labels" . | nindent 4 }}
    app.kubernetes.io/component: flink-jobmanager
spec:
  type: ClusterIP
  ports:
    - name: rpc
      port: 6123
      targetPort: rpc
    - name: blob
      port: 6124
      targetPort: blob
    - name: ui
      port: 8081
      targetPort: ui
  selector:
    {{- include "nexus.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: flink-jobmanager
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nexus.fullname" . }}-flink-taskmanager
  labels:
    {{- include "nexus.labels" . | nindent 4 }}
    app.kubernetes.io/component: flink-taskmanager
spec:
  replicas: {{ .Values.fraudDetection.taskManager.replicas }}
  selector:
    matchLabels:
      {{- include "nexus.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: flink-taskmanager
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9249"
      labels:
        {{- include "nexus.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: flink-taskmanager
    spec:
      serviceAccountName: {{ include "nexus.serviceAccountName" . }}
      containers:
        - name: taskmanager
          image: "{{ .Values.fraudDetection.image.repository }}:{{ .Values.fraudDetection.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.fraudDetection.image.pullPolicy }}
          args: ["taskmanager"]
          ports:
            - name: data
              containerPort: 6121
            - name: rpc
              containerPort: 6122
            - name: metrics
              containerPort: 9249
          env:
            - name: FLINK_PROPERTIES
              value: |
                jobmanager.rpc.address: {{ include "nexus.fullname" . }}-flink-jobmanager
                taskmanager.numberOfTaskSlots: 4
                taskmanager.memory.process.size: 2g
                taskmanager.memory.flink.size: 1g
                metrics.reporters: prom
                metrics.reporter.prom.class: org.apache.flink.metrics.prometheus.PrometheusReporter
                metrics.reporter.prom.port: 9249
            - name: KAFKA_BROKERS
              value: {{ include "nexus.kafkaUrl" . }}
          resources:
            {{- toYaml .Values.fraudDetection.taskManager.resources | nindent 12 }}
          livenessProbe:
            tcpSocket:
              port: 6122
            initialDelaySeconds: 30
            periodSeconds: 30
          volumeMounts:
            - name: flink-data
              mountPath: /flink-data
      volumes:
        - name: flink-data
          emptyDir: {}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/component: flink-taskmanager
                topologyKey: kubernetes.io/hostname
{{- end }}
