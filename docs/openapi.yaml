openapi: 3.1.0
info:
  title: Nexus RTP Platform API
  version: 1.0.0
  description: |
    Consolidated API specification for the Nexus Real-Time Payment Platform.
    All APIs use `/api/v1/` prefix and follow REST conventions.

    ## Authentication
    Most endpoints require a Bearer JWT token in the `Authorization` header.
    Tokens are obtained via `/api/v1/auth/login`.

    ## Idempotency
    POST endpoints support idempotency via the `Idempotency-Key` header.
    Replayed requests with the same key + body return the cached response.
    Requests with the same key but different body return `409 Conflict`.

    ## Multi-Tenancy
    JWT tokens carry a `tid` (tenant ID) claim. All data access is scoped
    to the tenant identified by this claim.
  contact:
    name: Nexus RTP Engineering
  license:
    name: UNLICENSED

servers:
  - url: http://localhost:8000
    description: Local development (via Kong Gateway)
  - url: https://api.staging.nexus-rtp.io
    description: Staging environment

tags:
  - name: Auth
    description: Authentication & authorization
  - name: Payments
    description: Payment initiation & status
  - name: Accounts
    description: Account management
  - name: Reconciliation
    description: Reconciliation engine
  - name: Notifications
    description: Notification delivery
  - name: Analytics
    description: Analytics & reporting

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: UUID for idempotent POST requests
      schema:
        type: string
        format: uuid

  schemas:
    ErrorResponse:
      type: object
      properties:
        code:
          type: string
          example: INVALID_REQUEST
        message:
          type: string
        details:
          type: string
        traceId:
          type: string
        timestamp:
          type: string
          format: date-time
      required: [code, message, timestamp]

    # --- Auth ---
    RegisterRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        firstName:
          type: string
        lastName:
          type: string
        organization:
          type: string
      required: [email, password, firstName, lastName]

    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      required: [email, password]

    LoginResponse:
      type: object
      properties:
        token:
          type: string
        refreshToken:
          type: string
        expiresAt:
          type: string
          format: date-time
        mfaRequired:
          type: boolean
        user:
          $ref: '#/components/schemas/UserProfile'

    UserProfile:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        organization:
          type: string
        role:
          type: string
          enum: [ADMIN, OPERATOR, VIEWER, COMPLIANCE]
        mfaEnabled:
          type: boolean
        status:
          type: string

    RefreshRequest:
      type: object
      properties:
        refreshToken:
          type: string
      required: [refreshToken]

    # --- Payments ---
    CreatePaymentRequest:
      type: object
      properties:
        uetr:
          type: string
          description: Unique End-to-End Transaction Reference
        amount:
          type: number
          format: decimal
        currency:
          type: string
          example: USD
        debtorAccount:
          type: string
        creditorAccount:
          type: string
        debtorName:
          type: string
        creditorName:
          type: string
        paymentType:
          type: string
          enum: [INSTANT, WIRE, ACH, SEPA]
        remittanceInfo:
          type: string
      required: [uetr, amount, currency, debtorAccount, creditorAccount]

    PaymentResponse:
      type: object
      properties:
        uetr:
          type: string
        status:
          type: string
          enum: [INITIATED, ACCEPTED, REJECTED, SETTLED, RETURNED]
        amount:
          type: number
        currency:
          type: string
        createdAt:
          type: string
          format: date-time

    # --- Accounts ---
    CreateAccountRequest:
      type: object
      properties:
        accountNumber:
          type: string
        accountName:
          type: string
        accountType:
          type: string
          enum: [SETTLEMENT, NOSTRO, VOSTRO, INTERNAL]
        currency:
          type: string
        holderName:
          type: string
        holderType:
          type: string
          enum: [INDIVIDUAL, CORPORATE]
      required: [accountNumber, accountName, currency]

    Account:
      type: object
      properties:
        id:
          type: string
          format: uuid
        accountNumber:
          type: string
        accountName:
          type: string
        accountType:
          type: string
        currency:
          type: string
        status:
          type: string
          enum: [ACTIVE, SUSPENDED, CLOSED, FROZEN]
        balance:
          type: number
        availableBalance:
          type: number
        kycStatus:
          type: string
          enum: [PENDING, VERIFIED, REJECTED, EXPIRED]
        createdAt:
          type: string
          format: date-time

    AccountBalance:
      type: object
      properties:
        accountId:
          type: string
          format: uuid
        balance:
          type: number
        availableBalance:
          type: number
        pendingBalance:
          type: number
        currency:
          type: string
        asOf:
          type: string
          format: date-time

    # --- Reconciliation ---
    RunReconciliationRequest:
      type: object
      properties:
        date:
          type: string
          format: date
      required: [date]

    ReconciliationCycle:
      type: object
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        totalTransactions:
          type: integer
        matchedCount:
          type: integer
        discrepancyCount:
          type: integer
        matchRate:
          type: number

    Discrepancy:
      type: object
      properties:
        id:
          type: string
          format: uuid
        cycleId:
          type: string
          format: uuid
        discrepancyType:
          type: string
        expectedValue:
          type: string
        actualValue:
          type: string
        severity:
          type: string
          enum: [LOW, MEDIUM, HIGH, CRITICAL]
        status:
          type: string
          enum: [OPEN, RESOLVED, ESCALATED]

    ResolveDiscrepancyRequest:
      type: object
      properties:
        resolution:
          type: string
        resolvedBy:
          type: string
      required: [resolution, resolvedBy]

paths:
  # ============================================================
  # Auth Service
  # ============================================================
  /api/v1/auth/register:
    post:
      tags: [Auth]
      summary: Register a new user
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Email already registered

  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Login with email and password
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Invalid credentials

  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh access token
      operationId: refreshToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Token refreshed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'

  /api/v1/auth/me:
    get:
      tags: [Auth]
      summary: Get current user profile
      operationId: getCurrentUser
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'

  /api/v1/auth/logout:
    post:
      tags: [Auth]
      summary: Logout (revoke refresh token)
      operationId: logoutUser
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Logged out

  /api/v1/auth/mfa/setup:
    post:
      tags: [Auth]
      summary: Setup MFA (generate TOTP secret)
      operationId: setupMFA
      security:
        - bearerAuth: []
      responses:
        '200':
          description: TOTP secret and QR URI

  /api/v1/auth/mfa/verify:
    post:
      tags: [Auth]
      summary: Verify MFA code during login
      operationId: verifyMFA
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                userId:
                  type: string
                  format: uuid
                code:
                  type: string
              required: [userId, code]
      responses:
        '200':
          description: MFA verified, token issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'

  # ============================================================
  # Payment Service
  # ============================================================
  /api/v1/payments:
    post:
      tags: [Payments]
      summary: Create a new payment
      operationId: createPayment
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePaymentRequest'
      responses:
        '201':
          description: Payment created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
        '409':
          description: Idempotency key collision (different payload)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Payment rejected (sanctions/fraud)

  /api/v1/payments/{uetr}:
    get:
      tags: [Payments]
      summary: Get payment status
      operationId: getPaymentStatus
      security:
        - bearerAuth: []
      parameters:
        - name: uetr
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Payment details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
        '404':
          description: Payment not found

  /api/v1/payments/{uetr}/settle:
    post:
      tags: [Payments]
      summary: Settle a payment
      operationId: settlePayment
      security:
        - bearerAuth: []
      parameters:
        - name: uetr
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Payment settled
        '404':
          description: Payment not found

  /api/v1/payments/{uetr}/return:
    post:
      tags: [Payments]
      summary: Return a payment
      operationId: returnPayment
      security:
        - bearerAuth: []
      parameters:
        - name: uetr
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reasonCode:
                  type: string
                reasonText:
                  type: string
                returnAmount:
                  type: string
              required: [reasonCode]
      responses:
        '200':
          description: Return initiated

  # ============================================================
  # Account Service
  # ============================================================
  /api/v1/accounts:
    post:
      tags: [Accounts]
      summary: Create a new account
      operationId: createAccount
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAccountRequest'
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '409':
          description: Idempotency key collision

    get:
      tags: [Accounts]
      summary: List accounts
      operationId: listAccounts
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            maximum: 100
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
        - name: status
          in: query
          schema:
            type: string
            enum: [ACTIVE, SUSPENDED, CLOSED, FROZEN]
      responses:
        '200':
          description: Account list
          content:
            application/json:
              schema:
                type: object
                properties:
                  accounts:
                    type: array
                    items:
                      $ref: '#/components/schemas/Account'
                  total:
                    type: integer
                  limit:
                    type: integer
                  offset:
                    type: integer

  /api/v1/accounts/{id}:
    get:
      tags: [Accounts]
      summary: Get account by ID
      operationId: getAccount
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Account details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '404':
          description: Account not found

  /api/v1/accounts/{id}/balance:
    get:
      tags: [Accounts]
      summary: Get account balance
      operationId: getAccountBalance
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Balance info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountBalance'

  /api/v1/accounts/{id}/status:
    patch:
      tags: [Accounts]
      summary: Update account status
      operationId: updateAccountStatus
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [ACTIVE, SUSPENDED, CLOSED, FROZEN]
              required: [status]
      responses:
        '200':
          description: Status updated

  /api/v1/accounts/{id}/kyc:
    patch:
      tags: [Accounts]
      summary: Update KYC status
      operationId: updateKYCStatus
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                kycStatus:
                  type: string
                  enum: [PENDING, VERIFIED, REJECTED, EXPIRED]
              required: [kycStatus]
      responses:
        '200':
          description: KYC status updated

  # ============================================================
  # Reconciliation Service
  # ============================================================
  /api/v1/reconciliation/run:
    post:
      tags: [Reconciliation]
      summary: Trigger reconciliation run
      operationId: runReconciliation
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunReconciliationRequest'
      responses:
        '200':
          description: Reconciliation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReconciliationCycle'

  /api/v1/reconciliation/cycles:
    get:
      tags: [Reconciliation]
      summary: List reconciliation cycles
      operationId: listReconciliationCycles
      security:
        - bearerAuth: []
      parameters:
        - name: start
          in: query
          schema:
            type: string
            format: date
        - name: end
          in: query
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Cycle list
          content:
            application/json:
              schema:
                type: object
                properties:
                  cycles:
                    type: array
                    items:
                      $ref: '#/components/schemas/ReconciliationCycle'

  /api/v1/reconciliation/cycles/{id}:
    get:
      tags: [Reconciliation]
      summary: Get reconciliation cycle
      operationId: getReconciliationCycle
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Cycle details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReconciliationCycle'
        '404':
          description: Cycle not found

  /api/v1/reconciliation/cycles/{id}/discrepancies:
    get:
      tags: [Reconciliation]
      summary: Get cycle discrepancies
      operationId: getCycleDiscrepancies
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Discrepancy list
          content:
            application/json:
              schema:
                type: object
                properties:
                  discrepancies:
                    type: array
                    items:
                      $ref: '#/components/schemas/Discrepancy'

  /api/v1/reconciliation/discrepancies/{id}/resolve:
    post:
      tags: [Reconciliation]
      summary: Resolve a discrepancy
      operationId: resolveDiscrepancy
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveDiscrepancyRequest'
      responses:
        '200':
          description: Discrepancy resolved
